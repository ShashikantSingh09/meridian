<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian test: हिंदी फ़ॉर्म</title>
<style>
  :root { color-scheme: light dark; --line: #8886; }
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; }
  .top { display: flex; gap: 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  main { max-width: 640px; margin: 48px auto; padding: 0 16px; }
  form { display: grid; gap: 12px; }
  label { display: grid; gap: 2px; }
  .tick { display: flex; gap: 8px; align-items: center; }
  input { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
</style>
</head>
<body>
<!-- A header search with no role, known only by its word. -->
<div class="top"><strong>सरकारी सेवा पोर्टल</strong><input placeholder="खोजें" aria-label="खोजें"></div>

<main>
  <h1>नया पंजीकरण</h1>
  <p>For <code>crates/fill/tests/live_forms.rs</code>. Nothing here goes online.</p>
  <form id="register">
    <label>पूरा नाम * <input id="name"></label>
    <label>ईमेल पता <input id="email"></label>
    <label>मोबाइल नंबर * <input id="mobile"></label>
    <label>जन्म तिथि <input id="dob" placeholder="दिन/माह/वर्ष"></label>
    <label>पिन कोड <input id="pin"></label>
    <input id="city" placeholder="अपना शहर लिखें">
    <label>पासवर्ड बनाएँ <input id="password" type="password"></label>
    <label>ओटीपी दर्ज करें <input id="otp"></label>
    <label class="tick"><input type="checkbox" id="agree"> मैं नियम और शर्तों से सहमत हूँ</label>
  </form>
</main>
</body>
</html>
