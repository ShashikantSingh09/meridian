[package]
name = "fill"
description = "Fill in the page: the box model, the never-fill rules, checks on the AI's mapping, the writer ladder and undo, with a Windows reader and writer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

# The core above builds anywhere, so a Mac reader and writer can sit beside the Windows one.
[target.'cfg(windows)'.dependencies]
screen = { path = "../screen" }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
