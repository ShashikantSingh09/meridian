[package]
name = "voice"
description = "Speaking and hearing: cloud voices, Windows voices, and speech that runs on this PC."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util.workspace = true
libloading = "0.8"
reqwest = { workspace = true, features = ["multipart"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Media_Core",
  "Media_SpeechRecognition",
  "Media_SpeechSynthesis",
  "Storage",
  "Storage_Streams",
  "System_UserProfile",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Power",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
] }
windows-collections = "0.3"
windows-registry = "0.6"

[dev-dependencies]
windows = { version = "0.62", features = ["Devices_Enumeration", "Media_Devices"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
