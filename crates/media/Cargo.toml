[package]
name = "media"
description = "Reads and controls media sessions through the Windows system media controls"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
serde.workspace = true
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Storage_Streams",
] }

[dev-dependencies]
serde_json.workspace = true
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Media_Playback",
  "Storage_Streams",
] }
