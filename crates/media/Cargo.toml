[package]
name = "media"
description = "Reads and controls media sessions through the Windows system media controls"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
windows = { version = "0.62", features = [
  "ApplicationModel",
  "Devices_Power",
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_Rpc",
  "Win32_System_Wmi",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[dev-dependencies]
serde_json.workspace = true
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Media_Playback",
  "Storage_Streams",
] }
