[package]
name = "meridian"
description = "Meridian: a universal AI companion for the Windows desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "meridian_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
activity = { path = "../../../crates/activity" }
agent-adapters = { path = "../../../crates/agent-adapters" }
ai-core = { path = "../../../crates/ai-core" }
base64 = "0.22"
chrono = "0.4"
getrandom = "0.3"
mcp = { path = "../../../crates/mcp" }
media = { path = "../../../crates/media" }
notes = { path = "../../../crates/notes" }
reqwest.workspace = true
screen = { path = "../../../crates/screen" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tokio.workspace = true
tokio-util.workspace = true
uuid = { version = "1", features = ["v4"] }
voice = { path = "../../../crates/voice" }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# The same versions wry already builds, so nothing is compiled twice.
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
